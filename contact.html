<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Lens Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-dark-header">
    <header class="site-header site-header-static scrolled" id="header">
        <nav class="main-nav" aria-label="Primary">
            <a class="logo" href="index.html#home">LENS STUDIO</a>
            <ul class="nav-list">
                <li><a href="index.html#home" class="nav-link">Home</a></li>
                <li><a href="index.html#projects" class="nav-link">Projects</a></li>
                <li><a href="add-project.html" class="nav-link">Add Project</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-main">
        <section class="contact-page-section">
            <div class="contact-page-shell">
                <div class="contact-page-grid">
                    <div class="contact-visual-panel">
                        <img
                            class="contact-visual-image"
                            src="images/rendy-novantino-V8idTEo5K20-unsplash.jpg"
                            alt="Cinematic production scene"
                        >
                    </div>

                    <div class="contact-content">
                        <h1 class="contact-page-title">Get In Touch</h1>
                        <p class="contact-page-copy">
                            Have a project in mind? Get in touch and let's bring your vision to life through Lens Studio.
                        </p>

                        <form class="contact-form" id="contact-form">
                            <div class="form-row-group">
                                <div class="form-row">
                                    <label class="form-label" for="contact-first-name">First Name*</label>
                                    <input
                                        id="contact-first-name"
                                        class="form-input"
                                        type="text"
                                        name="firstName"
                                        placeholder="Karl"
                                    >
                                </div>

                                <div class="form-row">
                                    <label class="form-label" for="contact-last-name">Last Name*</label>
                                    <input
                                        id="contact-last-name"
                                        class="form-input"
                                        type="text"
                                        name="lastName"
                                        placeholder="Hopper"
                                    >
                                </div>
                            </div>

                            <div class="form-row-group">
                                <div class="form-row">
                                    <label class="form-label" for="contact-category">Category</label>
                                    <div class="select-wrap">
                                        <select id="contact-category" class="form-select" name="category">
                                            <option value="" selected>Select</option>
                                            <option>Brand Film</option>
                                            <option>Documentary</option>
                                            <option>Commercial</option>
                                            <option>Photography</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-row">
                                    <label class="form-label" for="contact-email">Email</label>
                                    <input
                                        id="contact-email"
                                        class="form-input"
                                        type="email"
                                        name="email"
                                        placeholder="Lens_studio.com"
                                    >
                                </div>
                            </div>

                            <div class="form-row form-row-full form-row-description">
                                <label class="form-label" for="contact-message">Message</label>
                                <textarea
                                    id="contact-message"
                                    class="form-textarea"
                                    name="message"
                                    placeholder="Enter your message......"
                                ></textarea>
                            </div>

                            <button class="contact-submit-button" type="submit">Submit</button>
                            <p class="contact-form-status" id="contact-form-status" aria-live="polite"></p>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="contact" class="site-footer">
        <div class="footer-divider"></div>
        <div class="footer-intro">
            <p class="footer-kicker">Let's work together</p>
            <a class="footer-email" href="mailto:sayhi@lensstudio.com">sayhi@lensstudio.com</a>
            <a class="line-action footer-action" href="mailto:sayhi@lensstudio.com">
                <span>Contact Now</span>
                <span class="action-arrow" aria-hidden="true">↑</span>
            </a>
        </div>

        <div class="footer-links">
            <a href="index.html#home">Home</a>
            <a href="index.html#projects">Projects</a>
            <a href="add-project.html">Add Project</a>
            <a href="index.html#about">About</a>
            <a href="contact.html">Contact</a>
        </div>

        <div class="footer-divider"></div>

        <div class="footer-bottom">
            <p class="footer-brand">LENS STUDIO</p>
            <p class="footer-year">© 2026</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
